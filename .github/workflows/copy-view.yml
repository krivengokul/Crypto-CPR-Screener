name: Create Copy View

# Manually triggered only — via the Actions tab "Run workflow" button, or
# `gh workflow run copy-view.yml -f sourceKey=... -f newKey=... -f newLabel=...`
# from any terminal with `gh` installed and logged in. A static GitHub
# Pages site can't trigger this automatically without embedding a
# credential in browser JS, which we're deliberately avoiding — so this
# is a one-command manual step instead of a fully automatic button.
on:
  workflow_dispatch:
    inputs:
      sourceKey:
        description: "Key of the existing BACKTEST_TARGETS entry to copy"
        required: true
        type: string
      newKey:
        description: "Key for the new copy"
        required: true
        type: string
      newLabel:
        description: "Display label for the new copy"
        required: true
        type: string
      levelCheckDefs:
        description: "Base64 JSON array of {key, subject, bandKeys} — derived client-side for the specific symbol copied from. Omit/leave blank for a View with no levelCheckDefs."
        required: false
        type: string
      attachKey:
        description: "Key of the Category/Pattern/Subpattern node (in BACKTEST_CATEGORIES) to nest the copy under. Defaults to wherever sourceKey already lives if left blank. The copy still grades against the same original condition regardless of where it's attached."
        required: false
        type: string

# contents: write — lets the auto-generated GITHUB_TOKEN push the commit.
# actions: write — lets it also trigger deploy.yml via `gh workflow run`
# (see "Trigger the deploy workflow" step below).
permissions:
  contents: write
  actions: write

jobs:
  copy-view:
    runs-on: ubuntu-latest
    env:
      # Repo layout is artifacts/cpr-screener/src/... (not repo-root).
      BACKTEST_FILE_PATH: artifacts/cpr-screener/src/lib/backtest.ts
      VIEWS_SIDEBAR_FILE_PATH: artifacts/cpr-screener/src/lib/ViewsSidebar.tsx
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install patch script dependencies
        working-directory: .github/scripts/copy-view
        run: npm install

      - name: Apply the copy
        working-directory: .github/scripts/copy-view
        run: node patch.mjs
        env:
          SOURCE_KEY: ${{ inputs.sourceKey }}
          NEW_KEY: ${{ inputs.newKey }}
          NEW_LABEL: ${{ inputs.newLabel }}
          LEVEL_CHECK_DEFS_B64: ${{ inputs.levelCheckDefs }}
          ATTACH_KEY: ${{ inputs.attachKey }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$BACKTEST_FILE_PATH" "$VIEWS_SIDEBAR_FILE_PATH"
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Copy View: \"${{ inputs.sourceKey }}\" -> \"${{ inputs.newKey }}\" (+ Screener nav)"
          git push

      - name: Trigger the deploy workflow
        # Pushes made with the default GITHUB_TOKEN don't trigger other
        # workflows' `on: push` (GitHub's anti-recursion rule — prevents
        # workflow A's push from firing workflow B, which could in turn
        # fire A again, forever). deploy.yml never actually saw this
        # commit's push as an event. workflow_dispatch is a direct API
        # call instead of a push event, so it isn't subject to that rule
        # — this explicitly kicks off the same deploy.yml a normal push
        # would have triggered.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"