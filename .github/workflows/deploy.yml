name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm --filter @workspace/cpr-screener run build:gh-pages
        env:
          GITHUB_PAGES: "true"
          # Baked into the client bundle so the UI can show which commit is live
          VITE_GIT_SHA: ${{ github.sha }}
          VITE_GIT_SHORT: ${{ github.sha }}
          VITE_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          VITE_GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp artifacts/cpr-screener/dist/public/index.html artifacts/cpr-screener/dist/public/404.html
          touch artifacts/cpr-screener/dist/public/.nojekyll
          # Optional: plain text file for curl checks
          echo "${{ github.sha }}" > artifacts/cpr-screener/dist/public/build-sha.txt
          echo "${{ github.sha }}" > artifacts/cpr-screener/dist/public/version.txt

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/cpr-screener/dist/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
