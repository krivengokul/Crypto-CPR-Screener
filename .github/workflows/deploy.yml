name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm --filter @workspace/cpr-screener run build:gh-pages
        env:
          GITHUB_PAGES: "true"

      - name: Add SPA fallback and disable Jekyll
        run: |
          cp artifacts/cpr-screener/dist/public/index.html artifacts/cpr-screener/dist/public/404.html
          touch artifacts/cpr-screener/dist/public/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: artifacts/cpr-screener/dist/public
          publish_branch: gh-pages
          force_orphan: true
